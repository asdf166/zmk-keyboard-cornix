# ── cornix_left (central) ──
# 좌우는 반드시 동일하게! 한쪽만 다르면 PHY/출력 불일치로 키 고착 발생.
# (config/cornix_right.conf 와 내용이 한 글자도 다르면 안 됨)

# 송신 출력 +8dBm : 키 입력 업링크(오른쪽→왼쪽)를 강하게. 양쪽 동일 필수.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# PHY 는 양쪽 모두 기본(2M 협상)으로 둠.
# 굳이 1M 강제가 필요하면 아래 주석을 좌/우 '둘 다' 동시에 해제할 것.
# 한쪽만 풀면 이전(A) 같은 복구 불가 고착이 재발함.
# CONFIG_BT_CTLR_PHY_2M=n

# 패스키 호스트 페어링 : central(왼쪽)만 호스트와 짝을 짓기 때문에
# 사실상 왼쪽에서만 의미가 있음. 연결 안정성과는 무관.
# 원치 않으면 이 줄을 지우면 됨(기본 동작으로 돌아감).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
